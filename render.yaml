services:
  - type: web
    name: carbon-tracker-api
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_data && gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: carbon-tracker-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://carbon-tracker.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://carbon-tracker.onrender.com

  - type: web
    name: carbon-tracker
    env: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://carbon-tracker-api.onrender.com/api
