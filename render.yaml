services:
  - type: web
    name: carbon-tracker-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py seed_data
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbon-tracker-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: carbon-tracker-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://carbon-tracker.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://carbon-tracker.onrender.com

  - type: web
    name: carbon-tracker
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://carbon-tracker-api.onrender.com/api

databases:
  - name: carbon-tracker-db
    plan: free
    databaseName: carbon_tracker
    user: carbon_tracker_user
